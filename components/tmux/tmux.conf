source-file ~/.config/tmux/keymaps.conf
# tmux.conf — QWERTY vim-style (based on theniceboy/.config)
# Prefix: M-s (Opt+s) | Directions: h/j/k/l | Deploy: symlink to ~/.tmux.conf

# ─── General ─────────────────────────────────────────────────────
setw -g xterm-keys on
set -s escape-time 0                    # 无延迟，对 vim 友好
set -sg repeat-time 300
set -s focus-events on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g mouse on
set -sg exit-empty on
set -g detach-on-destroy off
set -g allow-passthrough on

set -q -g status-utf8 on
setw -q -g utf8 on

set -g visual-activity off
setw -g monitor-activity off
setw -g monitor-bell off

set -g history-limit 10000

# True color
set -g default-terminal "tmux-256color"
set -as terminal-features ",*256col*:RGB"
set -as terminal-overrides ",*256col*:Tc"

# Reload config

# ─── Prefix ──────────────────────────────────────────────────────

# ─── Display ─────────────────────────────────────────────────────
set -g base-index 1                     # 窗口从 1 开始编号
setw -g pane-base-index 1              # pane 从 1 开始编号
setw -g automatic-rename on
set -g renumber-windows on
set -g set-titles on
set -g display-panes-time 2000
set -g display-time 2000

# ─── Session ─────────────────────────────────────────────────────

# ─── Window Management ──────────────────────────────────────────

# Window navigation: Alt+数字

# Join pane to window: Alt+Shift+数字

# Window swap: Alt+,/. (避免与 M-l pane导航冲突)

# Rename

# ─── Pane: Split (prefix + h/j/k/l) ────────────────────────────

# ─── Pane: Navigate (Alt + h/j/k/l) ─────────────────────────────

# ─── Pane: Resize (Alt+Shift + H/J/K/L) ─────────────────────────

# ─── Pane: Swap & Zoom ──────────────────────────────────────────

# ─── Pane: Layout Builder (prefix + Shift) ──────────────────────

# ─── Pane: Move to Window ───────────────────────────────────────

# ─── Choose Tree ─────────────────────────────────────────────────

# ─── Copy Mode (vim-style) ──────────────────────────────────────
set -g status-keys emacs
set -g mode-keys vi



# Movement: standard vim

# Fast movement

# Word movement (standard vim)

# Line movement (standard vim)
# $ is already bound by default

# Yank

# Scroll

# Search

# Paste

# System clipboard paste

# ─── Theme ───────────────────────────────────────────────────────

# Pane borders
set -g pane-active-border-style fg=blue
set -g pane-border-style fg=colour244
setw -g pane-border-status top
setw -g pane-border-format ' #{?pane_active,#[fg=blue]●,#[fg=colour244]○} #T '

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style bg=colour235,fg=colour248
set -g status-left-length 40
set -g status-right-length 60

set -g status-left '#[fg=colour16,bg=blue,bold] ❐ #S #[fg=blue,bg=colour235] '
set -g status-right '#[fg=colour244] %Y-%m-%d #[fg=colour248,bold]%H:%M '

setw -g window-status-format '#[fg=colour244] #I:#W '
setw -g window-status-current-format '#[fg=blue,bold] #I:#W '
setw -g window-status-separator ''

# ─── Sync Input Toggle ──────────────────────────────────────────

# ─── Plugins (TPM) ──────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect: save pane contents
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save 's'

# Continuum: auto-save every 5 min
set -g @continuum-save-interval '5'

# Initialize TPM (keep at very bottom)
if-shell 'test -x ~/.tmux/plugins/tpm/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'
