name: mackit
name_en: MacKit
name_zh: 配置助手
display_name: MacKit · 配置助手
form: macos
lifecycle: active
origin: own
description: 原生 macOS App 与 CLI：安装配置、查询快捷键、编辑文件与备份恢复
bundle_id: cyou.tianli.mackit
key_scripts:
- bin/mackit
- scripts/build-app.sh
homepage: https://mackit.tianli.cyou
sop:
  test: ~/Dev/.venv/bin/python -m unittest discover -s tests
  test_inputs:
  - tests/**
  - scripts/accept/**
  - scripts/release-checksums.py
  accept:
    functionality: python3 scripts/accept/functionality.py
    recovery: python3 scripts/accept/recovery.py
    privacy: python3 scripts/accept/privacy.py
    native_ui: python3 scripts/accept/native_ui.py
  ui:
  - macos/Sources/ContentView.swift
  - macos/Sources/Models.swift
  - macos/Sources/MacKitApp.swift
  - macos/Sources/WindowPage.swift
  - macos/Sources/AppModel.swift
  - macos/Sources/EngineClient.swift
  - macos/Sources/UISelfTest.swift
  media:
  - site/media
  media_meta: site/media/manifest.json
  measure:
    app: installed
  promo_url: https://mackit.tianli.cyou/
  site_build: ~/Dev/.venv/bin/python scripts/build-site.py
  release: perf/release.json
  source:
  - macos/**
  - icon/**
  - mackit/**/*.py
  - bin/*
  - components/**
  - profiles/**
  - data/**
  - VERSION
  - scripts/build-app.sh
  - scripts/build-release.py
  - scripts/assemble-app.py
  - install.sh
  - LICENSE
  - THIRD_PARTY.md
  product:
    distribution: public
    source_visibility: public
    source_url: https://github.com/zengtianli/mackit
    rationale: 在原生界面中安装配置、查询快捷键、编辑文件与备份恢复。 面向外部使用者提供现有公开产品与源码入口，持续维护获取、教程和版本证据。
