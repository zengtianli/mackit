name: mackit
name_en: MacKit
name_zh: 配置助手
display_name: MacKit · 配置助手
form: macos
lifecycle: active
compatibility:
  schema: 1
  dependencies:
  - id: keyboard
    probe: keyboard
    consumers: [Apps/mackit]
    source_files: [bin/mackit]
    check_entry: mackit status --json; original config symlink targets and responsibility registry
    repair_entry: bin/mackit
    evidence_refs: [mac-pair/queue/20261007-0959-键盘分层在-mini-生效.reply.md]
origin: own
description: 原生 macOS App 与 CLI：安装配置、查询快捷键、编辑文件、窗口管理与备份恢复；App 各页都有供 Agent 调用的命令
bundle_id: cyou.tianli.mackit
key_scripts:
- bin/mackit
- scripts/build-app.sh
homepage: https://mackit.tianli.cyou
sop:
  account:
    mode: none
    rationale: 本地Mac配置工具，没有产品账号或注册登录；系统权限和Apple系统服务由macOS管理。
  platforms:
    mac: {}
    iphone:
      not_applicable: 当前套件管理 Mac 本机 Homebrew、launchd、Hammerspoon、Karabiner 与配置文件；iOS 不提供这些桌面系统管理能力。
    ipad:
      not_applicable: 当前套件管理 Mac 本机 Homebrew、launchd、Hammerspoon、Karabiner 与配置文件；iPadOS 不提供这些桌面系统管理能力。
    watch:
      not_applicable: watchOS 没有 Mac 本机配置树、桌面包管理、登录服务和 Hammerspoon、Karabiner 环境。
    vision:
      not_applicable: visionOS 不提供当前套件依赖的 Mac 本机配置树、Homebrew、launchd、Hammerspoon 与 Karabiner 环境。
  cli:
    commands: [mackit]
  agent_cli:
    readback: mackit status
    features:
    - name: 侧栏状态（已连接现有配置或从这里配置新电脑、版本号、隔离演示目录标记）
      command: mackit status
    - name: 工具栏「刷新」（⌘R）
      command: mackit status
    - name: 切换五个页面（侧栏、MacKit 菜单 ⌘1–⌘5）
      human: 只在窗口里有意义；每页的内容各有读命令
    - name: 工具栏「使用帮助」
      human: 只在窗口里有意义（打开主页）
    - name: 菜单「打开在线手册」
      human: 只在窗口里有意义（打开网页）
    - name: App 菜单「配置与更新…」
      human: 只在窗口里有意义（打开配置与更新窗口；窗口里的各项另列在下面）
    - name: 忙碌进度条与成功、错误横幅
      human: 只在窗口里有意义（窗口自己那次操作的进度与结果）；命令的结果在各自输出的 message、error 和退出码里
    - name: 退出时的「操作进行中 / 继续等待」提示
      human: 只在窗口里有意义；命令在前台跑到自己退出，没有可拦的退出
    - name: 菜单「搜索快捷键」（⌘F）
      command: mackit keys
    - name: 使用预设
      command: mackit select
    - name: 组件勾选（自动记住选择）
      command: mackit select
    - name: 预览配置变化（先准备配置源）
      command: mackit prepare
    - name: 即将应用的配置（预览列表）
      command: mackit plan
    - name: 备份并安装配置（含安装后 Karabiner 是否读入新规则的提示）
      command: mackit apply
    - name: 软件与依赖（各项是否已装）
      command: mackit deps
    - name: 安装缺失软件与依赖
      command: mackit deps
    - name: 软件安装运行记录
      command: mackit deps
    - name: 安装 Homebrew…
      human: 系统安装器要管理员密码；安装包地址在 mackit deps 的 JSON 里
    - name: Homebrew 官网、Karabiner 安装器链接
      human: 只在窗口里有意义（打开网页）
    - name: 辅助功能设置、输入监控设置
      human: 系统授权只能真人在系统设置里开
    - name: 搜索快捷键
      command: mackit keys
    - name: 按组件筛选快捷键
      command: mackit keys
    - name: 显示编码跳行
      command: mackit keys
    - name: 点快捷键来源（打开 GitHub 源文件或在 Finder 显示）
      human: 只在窗口里有意义；来源路径在 mackit keys 的结果里
    - name: 配置文件列表
      command: mackit file list
    - name: 读取文件
      command: mackit file read
    - name: 备份并保存（⌘S）
      command: mackit file write
    - name: 编辑 Karabiner 规则（配置文件页的 karabiner：列出、查看、添加、删除、启用、停用）
      command: mackit karabiner rule
    - name: 在 Finder 显示配置文件
      human: 只在窗口里有意义；路径在 mackit file list 的结果里
    - name: 放弃未保存修改（配置文件、窗口两页的草稿，含退出时的提示）
      human: 只在窗口里有意义；命令没有草稿，不保存就没有改动
    - name: 检查配置
      command: mackit doctor
    - name: 当前配置（配置源位置、配置版本、预设）
      command: mackit status
    - name: 安装恢复记录
      command: mackit status
    - name: 恢复最近一次安装…
      command: mackit restore
    - name: 打开备份目录
      human: 只在窗口里有意义；目录是 ~/.local/state/mackit
    - name: 窗口页运行状态（yabai、skhd、当前运行值）与「重新读取」
      command: mackit window status
    - name: 启动、停止 yabai 与 skhd
      command: mackit window service
    - name: yabai 设置（布局、间隙与边距、鼠标、外观共 19 项）
      command: mackit window set
    - name: skhd 快捷键（添加、改动作或命令、备注、删除）
      command: mackit window hotkey
    - name: 录制一个组合键
      human: 要真人按键；命令里用 --key 直接写组合键
    - name: 快捷键冲突与重复提示
      command: mackit keys
    - name: 应用规则（添加、接管、置顶、桌面、删除）
      command: mackit window rule
    - name: 保存并立即生效（⌘S）
      command: mackit window save
    - name: 只保存（⇧⌘S）
      command: mackit window save
    - name: 配置与更新窗口里的当前版本与构建号
      command: mackit status
    - name: 检查更新（App 菜单「检查更新…」与配置与更新窗口里的按钮）
      command: mackit update check
    - name: 升级到新版…
      command: mackit update install
    - name: 使用 iCloud 记住配置
      command: mackit config sync
    - name: 使用 iCloud 记住配置旁那句实时同步状态
      command: mackit config status
    - name: 导出配置…
      command: mackit config export
    - name: 导入配置…
      command: mackit config import
  test: ~/Dev/.venv/bin/python -m unittest discover -s tests
  test_inputs:
  - tests/**
  - scripts/accept/**
  - scripts/release-checksums.py
  accept:
    functionality: python3 scripts/accept/functionality.py
    recovery: python3 scripts/accept/recovery.py
    privacy: python3 scripts/accept/privacy.py
    native_ui: python3 scripts/accept/native_ui.py
    homepage_desktop: builtin:homepage_desktop
  ui:
  - macos/Sources/ContentView.swift
  - macos/Sources/Models.swift
  - macos/Sources/MacKitApp.swift
  - macos/Sources/WindowPage.swift
  - macos/Sources/AppModel.swift
  - macos/Sources/EngineClient.swift
  - macos/Sources/UISelfTest.swift
  media:
  - site/media
  media_meta: site/media/manifest.json
  capture: ~/Dev/.venv/bin/python scripts/capture-media.py  # 离屏重录 App 截图（窗口在所有屏幕之外、不激活）；装机版本≠VERSION 时 exit 75
  measure:
    app: installed
    download: dist/releases/MacKit-{short}-arm64.dmg
    ready_signal: os_log
    quiet_launch: [--background-measure]
    in_use: true
    data: 当前装机GUI只读加载本机配置快照并离屏绘制首屏；不保存偏好或更改系统配置。下载大小取现有0.3.6公开DMG，运行数据属于明确标记的本地验收构建。
    data_en: The installed GUI reads the production configuration snapshot and renders the initial view offscreen, without preference or system writes. Download bytes are from the existing public 0.3.6 DMG; runtime measurements identify the local acceptance build.
  promo_url: https://mackit.tianli.cyou/
  site_build: ~/Dev/.venv/bin/python scripts/build-site.py
  site_deploy: bash scripts/deploy-site.sh
  release: perf/release.json
  source:
  - macos/**
  - icon/**
  - mackit/**/*.py
  - bin/*
  - components/**
  - profiles/**
  - data/**
  - VERSION
  - scripts/build-app.sh
  - scripts/build-release.py
  - scripts/assemble-app.py
  - install.sh
  - LICENSE
  - THIRD_PARTY.md
  product:
    distribution: public
    source_visibility: public
    source_url: https://github.com/zengtianli/mackit
    rationale: 在原生界面中安装配置、查询快捷键、编辑文件与备份恢复。 面向外部使用者提供现有公开产品与源码入口，持续维护获取、教程和版本证据。
